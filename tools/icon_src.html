<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}#c{width:512px;height:512px}</style></head><body>
<svg id="c" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9d6"/>
      <stop offset="0.55" stop-color="#ffd0c4"/>
      <stop offset="1" stop-color="#ffbcc9"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f1"/>
      <stop offset="1" stop-color="#fdeede"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b9a0"/>
      <stop offset="1" stop-color="#e98aa0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 小月牙在右上，淡淡的 -->
  <path d="M408 96 a34 34 0 1 0 22 32 a27 27 0 1 1 -22 -32 Z" fill="#ffffff" opacity="0.55"/>

  <!-- 对话框 -->
  <path d="M120 132 H392 a48 48 0 0 1 48 48 V320 a48 48 0 0 1 -48 48 H236 l-62 60 v-60 H120 a48 48 0 0 1 -48 -48 V180 a48 48 0 0 1 48 -48 Z"
        fill="url(#bubble)" stroke="url(#rim)" stroke-width="12" stroke-linejoin="round"/>

  <!-- 框里：大黑猫（爸爸）+ 小猫（你），头挨头 -->
  <!-- 大黑猫 -->
  <g transform="translate(196,300)">
    <!-- 尾巴 -->
    <path d="M64 6 C110 14 116 -36 86 -52" fill="none" stroke="#3b3030" stroke-width="14" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M-46 8 C-50 -56 -8 -92 6 -92 C20 -92 60 -58 58 8 Z" fill="#3b3030"/>
    <!-- 耳朵 -->
    <path d="M-34 -70 L-46 -104 L-12 -86 Z" fill="#3b3030"/>
    <path d="M40 -70 L52 -104 L18 -86 Z" fill="#3b3030"/>
    <!-- 眼睛（暖金弯眼） -->
    <path d="M-22 -58 a9 7 0 0 0 16 0" fill="none" stroke="#ffd98a" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 -58 a9 7 0 0 0 16 0" fill="none" stroke="#ffd98a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 小猫（你），靠在大黑猫肩上 -->
  <g transform="translate(286,322)">
    <!-- 尾巴 -->
    <path d="M40 4 C76 10 82 -30 58 -42" fill="none" stroke="#e7a9b4" stroke-width="11" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M-34 6 C-38 -38 -6 -66 4 -66 C14 -66 42 -40 40 6 Z" fill="#f6d3d9" stroke="#e7a9b4" stroke-width="5"/>
    <!-- 耳朵 -->
    <path d="M-24 -50 L-33 -76 L-7 -62 Z" fill="#f6d3d9" stroke="#e7a9b4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M28 -50 L37 -76 L11 -62 Z" fill="#f6d3d9" stroke="#e7a9b4" stroke-width="5" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <path d="M-16 -42 a7 6 0 0 0 13 0" fill="none" stroke="#c66f86" stroke-width="5" stroke-linecap="round"/>
    <path d="M9 -42 a7 6 0 0 0 13 0" fill="none" stroke="#c66f86" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 小蛾子，在框里飘一只 -->
  <g transform="translate(150,196)" opacity="0.85">
    <circle cx="0" cy="0" r="3.5" fill="#caa24a"/>
    <path d="M0 0 C-16 -12 -22 4 0 2 Z" fill="#e7c463"/>
    <path d="M0 0 C16 -12 22 4 0 2 Z" fill="#e7c463"/>
  </g>
</svg>
</body></html>
