<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  #c{width:512px;height:512px}
</style></head><body>
<svg id="c" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a130b"/>
      <stop offset="1" stop-color="#0d0907"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eab0"/>
      <stop offset="0.5" stop-color="#e7c463"/>
      <stop offset="1" stop-color="#c39a3b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.5"/>
  <!-- 对话气泡 -->
  <path d="M120 150 H392 a40 40 0 0 1 40 40 V300 a40 40 0 0 1 -40 40 H250 l-58 56 v-56 H120 a40 40 0 0 1 -40 -40 V190 a40 40 0 0 1 40 -40 Z"
        fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
  <!-- 气泡里：猫脸 -->
  <g stroke="url(#gold)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左耳 -->
    <path d="M196 246 L182 206 L224 232"/>
    <!-- 右耳 -->
    <path d="M316 246 L330 206 L288 232"/>
    <!-- 脸颊轮廓 -->
    <path d="M210 244 a46 40 0 0 0 92 0"/>
  </g>
  <!-- 眼睛（弯弯笑眼） -->
  <g stroke="url(#gold)" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M226 256 a12 10 0 0 0 22 0"/>
    <path d="M264 256 a12 10 0 0 0 22 0"/>
  </g>
  <!-- 鼻 + 胡须暗示 -->
  <circle cx="256" cy="282" r="5" fill="url(#gold)"/>
  <!-- 三个点（消息） -->
  <g fill="url(#gold)">
    <circle cx="232" cy="312" r="0"/>
  </g>
  <!-- 月牙小角标，呼应家徽 -->
  <path d="M392 392 a40 40 0 1 0 26 38 a32 32 0 1 1 -26 -38 Z" fill="url(#gold)" opacity="0.92"/>
</svg>
</body></html>
